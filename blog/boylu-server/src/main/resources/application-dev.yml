server:
  port: 8800

site:
  frontend-url: http://localhost:3000

app:
  file:
    public-prefix: /boylu/file/content/
    chunk-size-mb: 2
    chunk-expire-hours: 24
    max-image-width: 6000
    max-image-height: 6000

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/blog?characterEncoding=UTF-8&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&tinyInt1isBit=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 3000
    database: 8


#==============================knife4j配置==============================
knife4j:
  enable: true
  basic:
    enable: true
    username: ${KNIFE4J_USERNAME:test}
    password: ${KNIFE4J_PASSWORD:change_me}
  openapi:
    title: boylu博客接口文档
    description: 一个专注于技术分享的博客平台
    # aaa"
    email: ${CONTACT_EMAIL:dev@example.com}
    concat: boylu
    url: http://localhost:8800
    version: v1.0
    group:
      test1:
        group-name: 分组名称
        api-rule: package
        api-rule-resources:
          - com.boylu

#==============================公众号配置==============================
wechat:
  app-id:
  # 公众号AppSecret
  secret:
  # 公众号Token
  token:
  # 公众号AES Key
  aesKey:

  appletAppId:
  appletSecret:

#==============================豆包推理AI配置=======================================
ai:
  # API Key
  apiKey:
  baseUrl: https://ark.cn-beijing.volces.com/api/v3
  # 推理接入点ID
  model:

hot-search:
  coderutil:
    access-key: ${CODERUTIL_ACCESS_KEY:}
    secret-key: ${CODERUTIL_SECRET_KEY:}

#==============================邮箱配置=======================================
notion:
  api-token: ${NOTION_API_TOKEN:}
  version: ${NOTION_VERSION:2022-06-28}
  api-base: ${NOTION_API_BASE:https://api.notion.com/v1}
  request-timeout-ms: ${NOTION_REQUEST_TIMEOUT_MS:20000}
  request-retry-times: ${NOTION_REQUEST_RETRY_TIMES:6}
  request-retry-delay-ms: ${NOTION_REQUEST_RETRY_DELAY_MS:1200}
  import-images: ${NOTION_IMPORT_IMAGES:false}
  max-image-size-mb: ${NOTION_MAX_IMAGE_SIZE_MB:10}
  auto-sync-enabled: ${NOTION_AUTO_SYNC_ENABLED:true}
  auto-sync-cron: "${NOTION_AUTO_SYNC_CRON:0 20 4 1/3 * ?}"
  auto-sync-limit: ${NOTION_AUTO_SYNC_LIMIT:100}

mail:
  smtp:
    host: smtp.163.com
    port: 25
    email:
    password:
    ssl-enable: false
    starttls-enable: false
    debug: false

#============================第三方登录配置信息===================================
qq:
  app-id:
  app-secret:
  redirect-url: http://localhost:8800/boylu/api/auth/callback/qq
weibo:
  app-id:
  app-secret:
  redirect-url: http://localhost:8800/boylu/api/auth/callback/weibo

gitee:
  app-id:
  app-secret:
  redirect-url: http://localhost:8800/boylu/api/auth/callback/gitee

github:
  app-id:
  app-secret:
  redirect-url: http://localhost:8800/boylu/api/auth/callback/github

seo:
  baidu:
    push:
      enabled: false
      endpoint: http://data.zz.baidu.com/urls
      site: https://boylu.cn
      token:
      article-path: /article/%d
      fallback-http-enabled: true
      connect-timeout-ms: 8000
      read-timeout-ms: 12000
      retry-times: 2
