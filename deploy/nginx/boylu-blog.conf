map $http_origin $boylu_cors_origin {
    default "";
    "https://boylu.cn" $http_origin;
    "https://www.boylu.cn" $http_origin;
    "http://localhost:3000" $http_origin;
    "http://127.0.0.1:3000" $http_origin;
    "http://localhost:5173" $http_origin;
    "http://127.0.0.1:5173" $http_origin;
    "http://localhost:8080" $http_origin;
    "http://127.0.0.1:8080" $http_origin;
}

server {
    listen 80;
    server_name boylu.cn www.boylu.cn;

    return 301 https://boylu.cn$request_uri;
}

server {
    listen 80;
    server_name 111.229.123.234 _;

    error_log /var/log/nginx/naxsi_public.log error;

    client_max_body_size 30m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    etag on;
    server_tokens off;
    include /etc/nginx/snippets/boylu-security-headers.inc;

    root /var/www/boylu-blog;
    index index.html;

    location = /boylu1107 {
        include /etc/nginx/snippets/boylu-security-headers.inc;
        default_type text/html;
        alias /var/www/boylu-blog/admin/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /boylu1107/index.html {
        alias /var/www/boylu-blog/admin/index.html;
    }

    location ^~ /boylu1107/assets/ {
        include /etc/nginx/snippets/boylu-security-headers.inc;
        alias /var/www/boylu-blog/admin/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /boylu1107/ {
        alias /var/www/boylu-blog/admin/;
        try_files $uri $uri/ /boylu1107/index.html;
    }

    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location = /console-9x7k { return 404; }
    location ^~ /console-9x7k/ { return 404; }

    location ^~ /assets/ {
        include /etc/nginx/snippets/boylu-security-headers.inc;
        alias /var/www/boylu-blog/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ^~ /images/ {
        include /etc/nginx/snippets/boylu-security-headers.inc;
        alias /var/www/boylu-blog/images/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/boylu-security-headers.inc;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /boylu/websocket/ {
        proxy_pass http://127.0.0.1:8800/websocket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /boylu/api/ai/chat/stream {
        include /etc/nginx/snippets/boylu-security-headers.inc;
        include /etc/nginx/snippets/boylu-cors-proxy.inc;
        proxy_pass http://127.0.0.1:8800/api/ai/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    location ~ ^/boylu/api/(webConfig|getNotice|album/list|album/detail/|album/photos/|article/detail/|article/list|article/home-list|article/archive|article/categories|article/categorie-all|article/getCarousels|article/getRecommends|friend/list|getHotSearch/|moment/list|resource/list|tag/list) {
        include /etc/nginx/snippets/boylu-security-headers.inc;
        include /etc/nginx/snippets/boylu-cors-proxy.inc;
        include /etc/nginx/snippets/naxsi-protect-api.inc;
        rewrite ^/boylu/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /boylu/ {
        include /etc/nginx/snippets/boylu-security-headers.inc;
        include /etc/nginx/snippets/boylu-cors-proxy.inc;
        proxy_pass http://127.0.0.1:8800/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ^~ /img/ {
        include /etc/nginx/snippets/boylu-security-headers.inc;
        proxy_pass http://127.0.0.1:8800/img/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /localFile/ {
        include /etc/nginx/snippets/boylu-security-headers.inc;
        alias /opt/boylu-blog/storage/;
        try_files $uri =404;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /NaxsiRequestDenied {
 internal;
 return 403;
 }

 location / {
 include /etc/nginx/snippets/naxsi-protect-public.inc;
 try_files $uri $uri/ /index.html;
 }
}

server {
    listen 443 ssl;
    server_name www.boylu.cn;

    ssl_certificate /etc/letsencrypt/live/boylu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boylu.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://boylu.cn$request_uri;
}

