server {
    listen 80;
    server_name 101.43.1.187 _;

    client_max_body_size 50m;
    root /var/www/boylu-blog;
    index index.html;

    location = /admin {
        return 404;
    }

    location ^~ /admin/ {
        return 404;
    }

    location = /console-9x7k {
        return 301 /console-9x7k/;
    }

    location /console-9x7k/ {
        auth_basic "Restricted Console";
        auth_basic_user_file /etc/nginx/.console-9x7k.htpasswd;
        alias /var/www/boylu-blog/admin/;
        try_files $uri $uri/ /console-9x7k/index.html;
    }

    location /mojian/websocket/ {
        proxy_pass http://127.0.0.1:8800/websocket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /mojian/ {
        proxy_pass http://127.0.0.1:8800/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /localFile/ {
        proxy_pass http://127.0.0.1:8800/localFile/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
